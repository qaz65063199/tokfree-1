<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Worker 调度台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 20px; background: radial-gradient(ellipse at 50% 0%, #ffffff 0%, #f0fdf4 70%, #e8f7ee 100%); color: #1f2937; }
    h2 { margin-top: 0; color: #111827; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; margin-bottom: 20px; }
    label { font-weight: 600; display: block; margin-bottom: 8px; color: #374151; }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fff; color: #1f2937; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.12); }
    textarea { height: 150px; resize: vertical; font-family: "Cascadia Code", "Consolas", monospace; }
    button { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; transition: all 0.2s; }
    button:hover { box-shadow: 0 6px 18px rgba(16,185,129,0.3); transform: translateY(-1px); }
    button:disabled { background: #d1d5db; cursor: not-allowed; box-shadow: none; transform: none; }
  </style>
</head>
<body>
  <h2>🤖 Worker 调度台 · TokFree</h2>
  <div class="card">
    <label>1. 选择目标 Worker 窗口：</label>
    <select id="workerSelect">
      <option value="">加载中...</option>
    </select>
  </div>
  <div class="card">
    <label>2. 项目目录（可选，留空则沿用该 Worker 已初始化的目录）：</label>
    <input id="projectDirInput" type="text" placeholder="例如 C:\Users\me\my-project" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;box-sizing:border-box;font-size:14px;" />
  </div>
  <div class="card">
    <label>3. 输入要派发的任务 (Prompt)：</label>
    <textarea id="promptInput" placeholder="请输入您要让 Worker AI 执行的任务..."></textarea>
  </div>
  <button id="dispatchBtn" onclick="doDispatch()">🚀 确认派发任务</button>

  <script>
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('init-workers', (event, workers) => {
      const select = document.getElementById('workerSelect');
      select.innerHTML = '';
      if (workers.length === 0) {
        select.innerHTML = '<option value="">没有可用的窗口，请先打开并登录</option>';
        document.getElementById('dispatchBtn').disabled = true;
      } else {
        workers.forEach(w => {
          const opt = document.createElement('option');
          opt.value = w.id;
          opt.textContent = w.name + ' (' + w.providerId + ')';
          select.appendChild(opt);
        });
      }
    });

    function doDispatch() {
      const profileId = document.getElementById('workerSelect').value;
      const prompt = document.getElementById('promptInput').value.trim();
      if (!profileId || !prompt) {
        alert('请选择窗口并输入任务！');
        return;
      }
      document.getElementById('dispatchBtn').textContent = '派发中...';
      document.getElementById('dispatchBtn').disabled = true;
      const projectDir = document.getElementById('projectDirInput').value.trim();
      ipcRenderer.send('ui-dispatch-task', { profileId, prompt, projectDir: projectDir || undefined });
    }
  </script>
</body>
</html>
